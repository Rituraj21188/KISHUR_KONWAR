<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Point Cloud Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.90);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e6edf3;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      min-width: 210px;
    }
    #ui h3 {
      margin: 0 0 12px 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #58a6ff;
    }
    .control-group {
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-group label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type=range] {
      width: 100px;
      accent-color: #58a6ff;
      cursor: pointer;
    }
    select, button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, border-color 0.2s;
    }
    select:hover, button:hover {
      background: #30363d;
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      margin-top: 6px;
      font-weight: 500;
      color: #58a6ff;
    }
    #loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #58a6ff;
      font-size: 14px;
      font-family: monospace;
      z-index: 20;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px auto;
      border: 3px solid rgba(88, 166, 255, 0.2);
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #error-box {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 11px;
      line-height: 1.4;
      max-width: 320px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-container">
    <div class="spinner" id="loading-spinner"></div>
    <div id="loading-text">Loading Point Cloud...</div>
    <div id="error-box"></div>
  </div>

  <div id="ui">
    <h3>Point Cloud Controls</h3>
    
    <div class="control-group">
      <span>Point Size</span>
      <input type="range" id="size-slider" min="0.005" max="0.1" step="0.005" value="0.025">
    </div>

    <div class="control-group">
      <label for="toggle-rotate">
        <input type="checkbox" id="toggle-rotate"> Auto-Rotate
      </label>
    </div>

    <div class="control-group">
      <span>Background</span>
      <select id="bg-select">
        <option value="dark">Dark</option>
        <option value="slate">Slate</option>
        <option value="light">Light</option>
      </select>
    </div>

    <button id="reset-cam">Reset View</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 10000);
    camera.position.set(0, 10, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.0;

    let pointsMaterial = null;
    let initialCameraPosition = new THREE.Vector3();
    let initialTarget = new THREE.Vector3(0, 0, 0);

    const loadingText = document.getElementById('loading-text');
    const loadingSpinner = document.getElementById('loading-spinner');
    const errorBox = document.getElementById('error-box');

    // Resolve URL directly against current execution path
    const plyUrl = new URL('cloud.ply', window.location.href).href;

    async function fetchAndRenderPLY() {
      try {
        loadingText.innerText = "Fetching cloud.ply...";
        const response = await fetch(plyUrl);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Failed to locate ${plyUrl}`);
        }

        const buffer = await response.arrayBuffer();

        // Check for Git LFS pointer files (< 300 bytes)
        if (buffer.byteLength < 300) {
          const text = new TextDecoder().decode(buffer);
          if (text.includes('git-lfs') || text.includes('oid sha256')) {
            throw new Error("Git LFS pointer detected: The actual binary cloud.ply file was not uploaded to Git.");
          }
        }

        loadingText.innerText = "Parsing Point Cloud...";
        const loader = new PLYLoader();
        const geometry = loader.parse(buffer);

        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        geometry.center();

        // Photogrammetry Z-up to Three.js Y-up
        geometry.rotateX(-Math.PI / 2);

        const hasColors = geometry.hasAttribute('color');
        pointsMaterial = new THREE.PointsMaterial({
          size: 0.025,
          vertexColors: hasColors,
          color: hasColors ? 0xffffff : 0x58a6ff,
          sizeAttenuation: true
        });

        const pointCloud = new THREE.Points(geometry, pointsMaterial);
        scene.add(pointCloud);

        geometry.computeBoundingSphere();
        const radius = geometry.boundingSphere?.radius || 15;

        camera.position.set(radius * 0.9, radius * 0.8, radius * 1.3);
        camera.near = radius / 100;
        camera.far = radius * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.maxDistance = radius * 8;
        controls.update();

        initialCameraPosition.copy(camera.position);
        initialTarget.copy(controls.target);

        document.getElementById('loading-container').style.display = 'none';
      } catch (err) {
        console.error("PLY Error:", err);
        loadingSpinner.style.display = 'none';
        loadingText.innerText = "Failed to load cloud.ply";
        loadingText.style.color = "#ef4444";
        errorBox.style.display = "block";
        errorBox.innerText = err.message || "Unknown PLY error.";
      }
    }

    fetchAndRenderPLY();

    document.getElementById('size-slider').addEventListener('input', (e) => {
      if (pointsMaterial) pointsMaterial.size = parseFloat(e.target.value);
    });

    document.getElementById('toggle-rotate').addEventListener('change', (e) => {
      controls.autoRotate = e.target.checked;
    });

    document.getElementById('bg-select').addEventListener('change', (e) => {
      const mode = e.target.value;
      if (mode === 'dark') scene.background.setHex(0x0d1117);
      else if (mode === 'slate') scene.background.setHex(0x21262d);
      else if (mode === 'light') scene.background.setHex(0xf8fafc);
    });

    document.getElementById('reset-cam').addEventListener('click', () => {
      camera.position.copy(initialCameraPosition);
      controls.target.copy(initialTarget);
      controls.update();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
