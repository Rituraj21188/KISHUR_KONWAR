<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mine Site Sentinel | 2D WebGIS & 3D Point Cloud</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Loaders.gl for in-browser LAZ decompression -->
  <script src="https://unpkg.com/@loaders.gl/core@3.4.4/dist/dist.min.js"></script>
  <script src="https://unpkg.com/@loaders.gl/las@3.4.4/dist/dist.min.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --panel-bg: rgba(22, 27, 34, 0.95);
      --border: #30363d;
      --accent: #f59e0b;
      --cyan: #33ccff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --font: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

    .viewport-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hidden { display: none !important; }

    .app-title {
      position: absolute; top: 14px; left: 14px; z-index: 500;
      background: var(--panel-bg); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      letter-spacing: 0.02em; backdrop-filter: blur(8px);
    }
    .app-title span { color: var(--text-muted); font-weight: 400; font-size: 11px; display: block; font-family: var(--mono); }

    .mode-bar {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 500;
      display: flex; gap: 4px; background: var(--panel-bg); border: 1px solid var(--border);
      padding: 4px; border-radius: 10px; backdrop-filter: blur(8px);
    }
    .mode-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .mode-btn.active { background: var(--accent); color: #000; }
    .mode-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.06); }

    .fullscreen-btn {
      position: absolute; top: 14px; right: 14px; z-index: 500;
      background: var(--panel-bg); border: 1px solid var(--border);
      color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .fullscreen-btn:hover { background: #21262d; border-color: var(--accent); color: var(--accent); }

    .opacity-panel {
      position: absolute; bottom: 20px; left: 14px; z-index: 500;
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(8px);
      font-size: 12px; width: 190px;
    }
    .opacity-panel label { display: block; color: var(--text-muted); margin-bottom: 4px; font-family: var(--mono); font-size: 11px; }
    .opacity-panel input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .pcd-panel {
      position: absolute; bottom: 20px; left: 14px; z-index: 500;
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; backdrop-filter: blur(8px);
      font-size: 12px; width: 220px; display: flex; flex-direction: column; gap: 10px;
    }
    .pcd-panel label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; font-family: var(--mono); }

    .legend {
      position: absolute; bottom: 20px; right: 14px; z-index: 500;
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; backdrop-filter: blur(8px);
      font-size: 12px; max-height: 260px; overflow-y: auto;
    }
    .legend div { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--text); }
    .legend .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
    .legend .swatch.point { border-radius: 50%; border: 1px solid #000; }
    .legend .swatch.line { height: 3px; }

    .leaflet-control-layers {
      background: var(--panel-bg) !important; border: 1px solid var(--border) !important;
      color: var(--text) !important; border-radius: 8px !important; font-family: var(--font) !important;
      backdrop-filter: blur(8px);
    }

    #loading-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 2000; background: var(--panel-bg); border: 1px solid var(--accent);
      padding: 16px 24px; border-radius: 12px; display: flex; align-items: center; gap: 12px;
      font-family: var(--mono); font-size: 13px; color: var(--accent); box-shadow: 0 12px 36px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="app-title">
    Mines Site Map Viewer
    <span>Orthomosaic · DSM · DTM · 3D Point Cloud</span>
  </div>

  <div class="mode-bar">
    <button id="tab-btn-2d" class="mode-btn active" onclick="switchViewerMode('2d')">
      <i class="fa-solid fa-map"></i> 2D WebGIS & Layers
    </button>
    <button id="tab-btn-3d" class="mode-btn" onclick="switchViewerMode('3d')">
      <i class="fa-solid fa-cubes-stacked"></i> 3D Mine LAZ Cloud
    </button>
  </div>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">
    <i class="fa-solid fa-expand"></i> Fullscreen
  </button>

  <div id="loading-banner" class="hidden">
    <i class="fa-solid fa-circle-notch fa-spin text-xl"></i>
    <span id="loading-status">Loading Model...</span>
  </div>

  <!-- VIEWPORT 1: LEAFLET 2D WEBGIS -->
  <div id="map" class="viewport-canvas"></div>

  <div class="opacity-panel" id="opacityPanel">
    <label id="opacityLabel">Orthomosaic opacity</label>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
  </div>

  <div class="legend" id="legendPanel">
    <div><span class="swatch point" style="background:#ffd700;"></span> Boundary Pillar</div>
    <div><span class="swatch line" style="background:#ff0000; border-top: 2px dashed #ff0000;"></span> Lease Boundary</div>
    <div><span class="swatch line" style="background:#00ff00; border-top: 2px dashed #00ff00;"></span> Safety Zone (7.5m)</div>
    <div><span class="swatch line" style="background:#33ccff;"></span> Road</div>
    <div><span class="swatch" style="background:#a89078;"></span> Block A</div>
    <div><span class="swatch" style="background:#d87093;"></span> Block B</div>
    <div><span class="swatch" style="background:#3cb371;"></span> Infrastructure</div>
  </div>

  <!-- VIEWPORT 2: THREE.JS 3D POINT CLOUD -->
  <div id="three-container" class="viewport-canvas hidden"></div>

  <div class="pcd-panel hidden" id="pcdPanel">
    <label><span>POINT SIZE</span> <span id="label-pt-size">2.2 px</span></label>
    <input type="range" id="slider-pt-size" min="0.5" max="6.0" step="0.2" value="2.2">
    <label><span>COLOR SCHEME</span></label>
    <div style="display:flex; gap:6px;">
      <button id="btn-col-elev" class="mode-btn active" style="flex:1; justify-content:center; border:1px solid var(--border);" onclick="setPcdColor('elevation')">Elevation</button>
      <button id="btn-col-rgb" class="mode-btn" style="flex:1; justify-content:center; border:1px solid var(--border);" onclick="setPcdColor('rgb')">True RGB</button>
    </div>
    <button class="mode-btn" style="width:100%; justify-content:center; border:1px solid var(--border); margin-top:4px;" onclick="reset3DCamera()">
      <i class="fa-solid fa-arrows-rotate"></i> Reset Camera
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let activeMode = '2d';
    const SITE_CENTER = [25.192475, 91.619639];
    const SITE_ZOOM = 17;
    const SITE_BOUNDS = L.latLngBounds([25.1830, 91.6090], [25.2020, 91.6300]);

    // 1. LEAFLET 2D ENGINE (COLOR SHAPES PRESERVED)
    const map = L.map('map', {
      zoomControl: true,
      minZoom: 16,
      maxZoom: 22,
      maxBounds: SITE_BOUNDS,
      maxBoundsViscosity: 1.0,
      scrollWheelZoom: true
    }).setView(SITE_CENTER, SITE_ZOOM);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 22
    }).addTo(map);

    map.createPane('droneRasterPane');
    map.getPane('droneRasterPane').style.zIndex = 400;

    const orthoLayer = L.tileLayer('./Tiles.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    }).addTo(map);

    const dsmLayer = L.tileLayer('./Tiles_DSM.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, opacity: 0.85, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    });

    const dtmLayer = L.tileLayer('./Tiles_DTM.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, opacity: 0.85, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    });

    map.createPane('vectorPane');
    map.getPane('vectorPane').style.zIndex = 650;

    const structuresLayer = L.geoJSON(null, {
      pane: 'vectorPane',
      style: function(feature) {
        const props = feature.properties || {};
        const name = String(props.layer || props.Layer || props.name || props.Name || props.LAYER || "").toUpperCase();

        if (name.includes("LEASE_BOUNDARY") || name.includes("LEASE")) {
          return { pane: 'vectorPane', color: "#ff0000", weight: 3, dashArray: "6, 6", fillOpacity: 0 };
        }
        if (name.includes("SAFETY_ZONE") || name.includes("7_5_M") || name.includes("SAFETY")) {
          return { pane: 'vectorPane', color: "#00ff00", weight: 2.5, dashArray: "4, 4", fillOpacity: 0 };
        }
        if (name.includes("ROAD")) {
          return { pane: 'vectorPane', color: "#33ccff", weight: 4, opacity: 0.95 };
        }
        if (name.includes("BLOCK - A") || name.includes("BLOCK_A") || name.includes("BLOCK A")) {
          return { pane: 'vectorPane', color: "#8b7355", fillColor: "#a89078", weight: 1.5, fillOpacity: 0.5 };
        }
        if (name.includes("BLOCK - B") || name.includes("BLOCK_B") || name.includes("BLOCK B")) {
          return { pane: 'vectorPane', color: "#c71585", fillColor: "#d87093", weight: 1.5, fillOpacity: 0.55 };
        }
        if (name.includes("INFRASTRUCTURE")) {
          return { pane: 'vectorPane', color: "#2e8b57", fillColor: "#3cb371", weight: 1.5, fillOpacity: 0.7 };
        }
        return { pane: 'vectorPane', color: "#ffff00", weight: 2, fillOpacity: 0.3 };
      },

      pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
          pane: 'vectorPane', radius: 7, fillColor: "#ffd700", color: "#000000", weight: 2, fillOpacity: 1
        });
      },

      onEachFeature: function(feature, layer) {
        const props = feature.properties || {};
        const title = props.layer || props.Layer || props.name || props.Name || "Site Feature";
        layer.bindPopup(`<b>${title}</b>`);
      }
    }).addTo(map);

    fetch('./data/structures-structures.geojson')
      .then(res => res.json())
      .then(data => structuresLayer.addData(data))
      .catch(err => console.warn("Vector layer note:", err));

    L.control.layers({ "OpenStreetMap": osm }, {
      "Orthomosaic": orthoLayer,
      "DSM (surface model)": dsmLayer,
      "DTM (terrain model)": dtmLayer,
      "Structures & Boundaries": structuresLayer
    }, { collapsed: false }).addTo(map);

    const opacitySlider = document.getElementById('opacitySlider');
    opacitySlider.oninput = () => {
      orthoLayer.setOpacity(parseFloat(opacitySlider.value));
      dsmLayer.setOpacity(parseFloat(opacitySlider.value));
      dtmLayer.setOpacity(parseFloat(opacitySlider.value));
    };

    // 2. THREE.JS 3D ENGINE (METRIC DEGREE CONVERSION)
    let threeScene, threeCamera, threeRenderer, threeControls, pcdMesh;
    let pcdColorsRGB, pcdColorsElevation, sceneRadius = 300;
    let isLazLoaded = false;

    function initThreeEngine() {
      const container = document.getElementById('three-container');
      threeScene = new THREE.Scene();
      threeScene.background = new THREE.Color(0x0d1117);

      threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50000);
      threeCamera.position.set(0, 150, 260);

      threeRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      threeRenderer.setSize(window.innerWidth, window.innerHeight);
      threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(threeRenderer.domElement);

      threeControls = new THREE.OrbitControls(threeCamera, threeRenderer.domElement);
      threeControls.enableDamping = true;
      threeControls.dampingFactor = 0.05;

      threeScene.add(new THREE.AmbientLight(0xffffff, 1.4));

      window.addEventListener('resize', () => {
        if (activeMode === '3d') {
          threeCamera.aspect = window.innerWidth / window.innerHeight;
          threeCamera.updateProjectionMatrix();
          threeRenderer.setSize(window.innerWidth, window.innerHeight);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        if (activeMode === '3d') {
          threeControls.update();
          threeRenderer.render(threeScene, threeCamera);
        }
      }
      animate();
    }

    async function loadMinePointcloud() {
      if (isLazLoaded) return;
      const banner = document.getElementById('loading-banner');
      const statusText = document.getElementById('loading-status');
      banner.classList.remove('hidden');
      statusText.innerText = "Downloading mine-site-viewer.laz...";

      try {
        const response = await fetch('./mine-site-viewer.laz');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();

        statusText.innerText = "Decompressing LAZ Cloud...";
        const data = await loaders.load(buffer, loaders.LASLoader);

        const pos = data.attributes.POSITION.value;
        const total = pos.length / 3;
        const step = total > 2000000 ? 2 : 1;
        const count = Math.floor(total / step);

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (let i = 0; i < total; i += step) {
          const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
        }

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;
        const midZ = (minZ + maxZ) / 2;

        // Convert Geographic Degrees to Metric Distances
        const isGeographic = (Math.abs(midX) <= 180 && Math.abs(midY) <= 90);
        const latRad = (midY * Math.PI) / 180.0;
        const metersPerDegLon = isGeographic ? (111320.0 * Math.cos(latRad)) : 1.0;
        const metersPerDegLat = isGeographic ? 110540.0 : 1.0;

        const centered = new Float32Array(count * 3);
        const rgb = new Float32Array(count * 3);
        const elev = new Float32Array(count * 3);
        const rangeZ = (maxZ - minZ) || 1.0;
        const colorAttr = data.attributes.COLOR_0 ? data.attributes.COLOR_0.value : null;

        let dst = 0;
        for (let i = 0; i < total; i += step) {
          const rx = pos[i * 3], ry = pos[i * 3 + 1], rz = pos[i * 3 + 2];

          // Scaled to real-world meters
          centered[dst * 3]     = (rx - midX) * metersPerDegLon;
          centered[dst * 3 + 1] = rz - midZ;
          centered[dst * 3 + 2] = -((ry - midY) * metersPerDegLat);

          if (colorAttr) {
            rgb[dst * 3]     = colorAttr[i * 4] / 255.0;
            rgb[dst * 3 + 1] = colorAttr[i * 4 + 1] / 255.0;
            rgb[dst * 3 + 2] = colorAttr[i * 4 + 2] / 255.0;
          } else {
            rgb[dst * 3] = 0.9; rgb[dst * 3 + 1] = 0.6; rgb[dst * 3 + 2] = 0.2;
          }

          const nz = (rz - minZ) / rangeZ;
          elev[dst * 3]     = Math.min(1.0, nz * 1.6);
          elev[dst * 3 + 1] = Math.max(0.1, 1.0 - Math.abs(nz - 0.5) * 2);
          elev[dst * 3 + 2] = Math.max(0.0, 1.0 - nz * 1.6);
          dst++;
        }

        pcdColorsRGB = rgb;
        pcdColorsElevation = elev;

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(centered, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(elev, 3));

        const mat = new THREE.PointsMaterial({ size: 2.2, vertexColors: true, sizeAttenuation: true });
        pcdMesh = new THREE.Points(geom, mat);
        threeScene.add(pcdMesh);

        const extentX = (maxX - minX) * metersPerDegLon;
        const extentY = (maxY - minY) * metersPerDegLat;
        const extentZ = maxZ - minZ;
        sceneRadius = Math.max(extentX, extentY, extentZ) * 0.75 || 250;

        reset3DCamera();

        isLazLoaded = true;
        banner.classList.add('hidden');
      } catch (err) {
        console.error(err);
        statusText.innerText = "Error parsing LAZ point cloud.";
        setTimeout(() => banner.classList.add('hidden'), 3500);
      }
    }

    function reset3DCamera() {
      const d = sceneRadius * 1.6;
      threeCamera.position.set(0, d * 0.75, d);
      threeCamera.lookAt(0, 0, 0);
      threeControls.target.set(0, 0, 0);
      threeControls.update();
    }

    function setPcdColor(mode) {
      if (!pcdMesh) return;
      document.getElementById('btn-col-elev').classList.toggle('active', mode === 'elevation');
      document.getElementById('btn-col-rgb').classList.toggle('active', mode === 'rgb');

      const col = (mode === 'rgb' && pcdColorsRGB) ? pcdColorsRGB : pcdColorsElevation;
      pcdMesh.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
      pcdMesh.geometry.attributes.color.needsUpdate = true;
    }

    document.getElementById('slider-pt-size').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('label-pt-size').innerText = v.toFixed(1) + ' px';
      if (pcdMesh) pcdMesh.material.size = v;
    });

    // 3. MODE SWITCHING
    function switchViewerMode(mode) {
      activeMode = mode;
      document.getElementById('tab-btn-2d').classList.toggle('active', mode === '2d');
      document.getElementById('tab-btn-3d').classList.toggle('active', mode === '3d');

      const mapEl = document.getElementById('map');
      const threeEl = document.getElementById('three-container');
      const op = document.getElementById('opacityPanel');
      const leg = document.getElementById('legendPanel');
      const pcdPan = document.getElementById('pcdPanel');

      if (mode === '2d') {
        mapEl.classList.remove('hidden');
        threeEl.classList.add('hidden');
        op.classList.remove('hidden');
        leg.classList.remove('hidden');
        pcdPan.classList.add('hidden');
        map.invalidateSize();
      } else {
        mapEl.classList.add('hidden');
        threeEl.classList.remove('hidden');
        op.classList.add('hidden');
        leg.classList.add('hidden');
        pcdPan.classList.remove('hidden');

        if (!threeRenderer) initThreeEngine();
        loadMinePointcloud();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }
  </script>
</body>
</html>
