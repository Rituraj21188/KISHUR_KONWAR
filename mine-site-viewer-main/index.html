<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mine Site Sentinel | Drone Analytics & 3D Point Cloud</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Loaders.gl for In-Browser LAZ Decompression -->
  <script src="https://unpkg.com/@loaders.gl/core@3.4.4/dist/dist.min.js"></script>
  <script src="https://unpkg.com/@loaders.gl/las@3.4.4/dist/dist.min.js"></script>

  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: #111827;
      --panel-bg: rgba(17, 24, 39, 0.92);
      --border: #1f2937;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --cyan: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

    .viewport { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hidden { display: none !important; }

    /* Top Navigation HUD */
    header {
      position: absolute; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; pointer-events: none;
    }
    .hud-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .brand { font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; font-family: var(--mono); }
    .brand span { color: var(--accent); }

    .tab-switcher { display: flex; gap: 4px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--accent); color: #000; }
    .tab-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

    /* Control Drawers */
    .control-panel {
      position: absolute; bottom: 20px; left: 14px; z-index: 1000;
      width: 250px; background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; backdrop-filter: blur(12px);
      font-size: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .control-panel h4 { font-size: 11px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; margin-bottom: 10px; display: flex; items-center; justify-content: space-between; }
    .control-row { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
    .control-row label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    /* Legend Box */
    .legend-box {
      position: absolute; bottom: 20px; right: 14px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; backdrop-filter: blur(12px);
      font-size: 11px; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* Loading Banner */
    #loader-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 2000; background: var(--panel-bg); border: 1px solid var(--border);
      padding: 16px 24px; border-radius: 12px; display: flex; align-items: center; gap: 12px;
      font-family: var(--mono); font-size: 12px; color: var(--accent); box-shadow: 0 12px 36px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="hud-box brand">
      <span>▲</span> MINE SENTINEL <span>|</span> DGCA & IBM RULE 34A
    </div>
    <div class="hud-box">
      <div class="tab-switcher">
        <button id="btn-mode-2d" class="tab-btn active" onclick="switchMode('2d')">
          <i class="fa-solid fa-map"></i> 2D WebGIS & Layers
        </button>
        <button id="btn-mode-3d" class="tab-btn" onclick="switchMode('3d')">
          <i class="fa-solid fa-cubes-stacked"></i> 3D Mine LAZ Cloud
        </button>
      </div>
    </div>
  </header>

  <!-- Loader Banner -->
  <div id="loader-banner" class="hidden">
    <i class="fa-solid fa-circle-notch fa-spin text-xl"></i>
    <span id="loader-text">Initializing Engine...</span>
  </div>

  <!-- MODE 1: LEAFLET 2D WEBGIS (ORTHO + DSM + DTM + VECTOR) -->
  <div id="map-engine" class="viewport"></div>

  <!-- MODE 2: THREE.JS 3D POINT CLOUD (LAZ DECOMPRESSION) -->
  <div id="three-engine" class="viewport hidden"></div>

  <!-- 2D GIS Controls -->
  <div id="panel-2d" class="control-panel">
    <h4><span>Raster Blending</span> <i class="fa-solid fa-sliders"></i></h4>
    <div class="control-row">
      <label><span>Layer Opacity</span> <span id="label-2d-opacity">100%</span></label>
      <input type="range" id="slider-2d-opacity" min="0" max="1" step="0.05" value="1">
    </div>
    <div style="font-size:10px; color:var(--text-muted); font-family:var(--mono); margin-top:8px;">
      Use Top-Right layer control to toggle Orthomosaic, DSM, and DTM.
    </div>
  </div>

  <!-- 3D Cloud Controls -->
  <div id="panel-3d" class="control-panel hidden">
    <h4><span>3D Point Controls</span> <i class="fa-solid fa-cube"></i></h4>
    <div class="control-row">
      <label><span>Color Mode</span></label>
      <div style="display:flex; gap:4px; margin-top:4px;">
        <button id="btn-col-elevation" class="tab-btn active" style="flex:1; justify-content:center;" onclick="setColorMode('elevation')">Elevation</button>
        <button id="btn-col-rgb" class="tab-btn" style="flex:1; justify-content:center;" onclick="setColorMode('rgb')">True RGB</button>
      </div>
    </div>
    <div class="control-row">
      <label><span>Point Size</span> <span id="label-pt-size">2.0 px</span></label>
      <input type="range" id="slider-pt-size" min="0.5" max="5.0" step="0.2" value="2.0">
    </div>
    <button class="tab-btn" style="width:100%; justify-content:center; margin-top:6px; border:1px solid var(--border);" onclick="reset3DCamera()">
      <i class="fa-solid fa-arrows-rotate"></i> Reset Camera
    </button>
  </div>

  <!-- 2D Legend -->
  <div id="legend-2d" class="legend-box">
    <div class="legend-item"><span class="swatch" style="background:#ffd700; border-radius:50%;"></span> Boundary Pillar</div>
    <div class="legend-item"><span class="swatch" style="background:#ff0000;"></span> Lease Boundary</div>
    <div class="legend-item"><span class="swatch" style="background:#00ff00;"></span> 7.5m Safety Zone</div>
    <div class="legend-item"><span class="swatch" style="background:#33ccff;"></span> Haul Road</div>
    <div class="legend-item"><span class="swatch" style="background:#d87093;"></span> Active Bench</div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let currentMode = '2d';
    const SITE_CENTER = [25.192475, 91.619639];
    const SITE_BOUNDS = L.latLngBounds([25.1830, 91.6090], [25.2020, 91.6300]);

    // ==========================================
    // 1. ENGINE 1: 2D Leaflet WebGIS Setup
    // ==========================================
    const map = L.map('map-engine', {
      zoomControl: true,
      minZoom: 15,
      maxZoom: 22,
      maxBounds: SITE_BOUNDS,
      scrollWheelZoom: true
    }).setView(SITE_CENTER, 17);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);

    map.createPane('droneRasterPane');
    map.getPane('droneRasterPane').style.zIndex = 400;

    const orthoLayer = L.tileLayer('./Tiles.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    }).addTo(map);

    const dsmLayer = L.tileLayer('./Tiles_DSM.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, opacity: 0.85, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    });

    const dtmLayer = L.tileLayer('./Tiles_DTM.tif/{z}/{x}/{y}.png', {
      maxZoom: 22, maxNativeZoom: 20, tms: true, opacity: 0.85, bounds: SITE_BOUNDS, pane: 'droneRasterPane'
    });

    map.createPane('vectorPane');
    map.getPane('vectorPane').style.zIndex = 650;

    const structuresLayer = L.geoJSON(null, {
      pane: 'vectorPane',
      style: (feature) => {
        const name = String(feature.properties?.layer || feature.properties?.name || "").toUpperCase();
        if (name.includes("LEASE")) return { color: "#ff0000", weight: 3, dashArray: "6,6" };
        if (name.includes("SAFETY")) return { color: "#00ff00", weight: 2.5, dashArray: "4,4" };
        if (name.includes("ROAD")) return { color: "#33ccff", weight: 4 };
        return { color: "#ffd700", weight: 2, fillOpacity: 0.4 };
      },
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 6, fillColor: "#ffd700", color: "#000", weight: 2, fillOpacity: 1 })
    }).addTo(map);

    fetch('./data/structures-structures.geojson')
      .then(res => res.json())
      .then(data => structuresLayer.addData(data))
      .catch(e => console.warn("Vector layer note:", e));

    L.control.layers({ "OpenStreetMap": osm }, {
      "Orthomosaic": orthoLayer,
      "DSM (Digital Surface)": dsmLayer,
      "DTM (Bare Earth)": dtmLayer,
      "Structures": structuresLayer
    }, { collapsed: false }).addTo(map);

    document.getElementById('slider-2d-opacity').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      orthoLayer.setOpacity(v);
      dsmLayer.setOpacity(v);
      dtmLayer.setOpacity(v);
      document.getElementById('label-2d-opacity').innerText = Math.round(v * 100) + '%';
    });

    // ==========================================
    // 2. ENGINE 2: Three.js 3D LAZ Point Cloud
    // ==========================================
    let threeScene, threeCamera, threeRenderer, threeControls, pcdMesh;
    let pcdColorsRGB, pcdColorsElevation, sceneRadius = 150;
    let isLazLoaded = false;

    function initThreeEngine() {
      const container = document.getElementById('three-engine');
      threeScene = new THREE.Scene();
      threeScene.background = new THREE.Color(0x0a0e17);

      threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50000);
      threeCamera.position.set(0, 150, 250);

      threeRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      threeRenderer.setSize(window.innerWidth, window.innerHeight);
      threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(threeRenderer.domElement);

      threeControls = new THREE.OrbitControls(threeCamera, threeRenderer.domElement);
      threeControls.enableDamping = true;
      threeControls.dampingFactor = 0.05;

      threeScene.add(new THREE.AmbientLight(0xffffff, 1.2));

      const grid = new THREE.GridHelper(300, 30, 0xf59e0b, 0x1f2937);
      grid.position.y = -2;
      threeScene.add(grid);

      window.addEventListener('resize', () => {
        if (currentMode === '3d') {
          threeCamera.aspect = window.innerWidth / window.innerHeight;
          threeCamera.updateProjectionMatrix();
          threeRenderer.setSize(window.innerWidth, window.innerHeight);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        if (currentMode === '3d') {
          threeControls.update();
          threeRenderer.render(threeScene, threeCamera);
        }
      }
      animate();
    }

    async function loadMineLaz() {
      if (isLazLoaded) return;
      const loader = document.getElementById('loader-banner');
      const loaderText = document.getElementById('loader-text');
      loader.classList.remove('hidden');
      loaderText.innerText = "Downloading mine-site-viewer.laz...";

      try {
        const response = await fetch('./mine-site-viewer.laz');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();

        loaderText.innerText = "Decompressing LAZ Cloud...";
        const data = await loaders.load(buffer, loaders.LASLoader);

        const pos = data.attributes.POSITION.value;
        const total = pos.length / 3;
        const step = total > 2000000 ? 2 : 1;
        const count = Math.floor(total / step);

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (let i = 0; i < total; i += step) {
          const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
        }

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;
        const midZ = (minZ + maxZ) / 2;

        const centered = new Float32Array(count * 3);
        const rgb = new Float32Array(count * 3);
        const elev = new Float32Array(count * 3);
        const rangeZ = (maxZ - minZ) || 1.0;

        const colorAttr = data.attributes.COLOR_0 ? data.attributes.COLOR_0.value : null;
        let dst = 0;

        for (let i = 0; i < total; i += step) {
          const rx = pos[i * 3], ry = pos[i * 3 + 1], rz = pos[i * 3 + 2];
          centered[dst * 3]     = rx - midX;
          centered[dst * 3 + 1] = rz - midZ;
          centered[dst * 3 + 2] = -(ry - midY);

          if (colorAttr) {
            rgb[dst * 3]     = colorAttr[i * 4] / 255.0;
            rgb[dst * 3 + 1] = colorAttr[i * 4 + 1] / 255.0;
            rgb[dst * 3 + 2] = colorAttr[i * 4 + 2] / 255.0;
          } else {
            rgb[dst * 3] = 0.9; rgb[dst * 3 + 1] = 0.6; rgb[dst * 3 + 2] = 0.2;
          }

          // Elevation heat coloring
          const nz = (rz - minZ) / rangeZ;
          elev[dst * 3]     = Math.min(1.0, nz * 1.6);
          elev[dst * 3 + 1] = Math.max(0.1, 1.0 - Math.abs(nz - 0.5) * 2);
          elev[dst * 3 + 2] = Math.max(0.0, 1.0 - nz * 1.6);

          dst++;
        }

        pcdColorsRGB = rgb;
        pcdColorsElevation = elev;

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(centered, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(elev, 3));

        const material = new THREE.PointsMaterial({
          size: 2.0, vertexColors: true, sizeAttenuation: true
        });

        pcdMesh = new THREE.Points(geometry, material);
        threeScene.add(pcdMesh);

        sceneRadius = Math.max(maxX - minX, maxY - minY, maxZ - minZ) * 0.7;
        reset3DCamera();

        isLazLoaded = true;
        loader.classList.add('hidden');
      } catch (err) {
        console.error(err);
        loaderText.innerText = "Error parsing LAZ file.";
        setTimeout(() => loader.classList.add('hidden'), 3500);
      }
    }

    function reset3DCamera() {
      const d = sceneRadius * 1.6;
      threeCamera.position.set(0, d * 0.7, d);
      threeCamera.lookAt(0, 0, 0);
      threeControls.target.set(0, 0, 0);
      threeControls.update();
    }

    function setColorMode(mode) {
      if (!pcdMesh) return;
      document.getElementById('btn-col-elevation').classList.toggle('active', mode === 'elevation');
      document.getElementById('btn-col-rgb').classList.toggle('active', mode === 'rgb');

      const col = (mode === 'rgb' && pcdColorsRGB) ? pcdColorsRGB : pcdColorsElevation;
      pcdMesh.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
      pcdMesh.geometry.attributes.color.needsUpdate = true;
    }

    document.getElementById('slider-pt-size').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('label-pt-size').innerText = v.toFixed(1) + ' px';
      if (pcdMesh) pcdMesh.material.size = v;
    });

    // ==========================================
    // 3. Mode Switcher (2D vs 3D)
    // ==========================================
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-2d').classList.toggle('active', mode === '2d');
      document.getElementById('btn-mode-3d').classList.toggle('active', mode === '3d');

      const mapEl = document.getElementById('map-engine');
      const threeEl = document.getElementById('three-engine');
      const p2d = document.getElementById('panel-2d');
      const p3d = document.getElementById('panel-3d');
      const l2d = document.getElementById('legend-2d');

      if (mode === '2d') {
        mapEl.classList.remove('hidden');
        threeEl.classList.add('hidden');
        p2d.classList.remove('hidden');
        p3d.classList.add('hidden');
        l2d.classList.remove('hidden');
        map.invalidateSize();
      } else {
        mapEl.classList.add('hidden');
        threeEl.classList.remove('hidden');
        p2d.classList.add('hidden');
        p3d.classList.remove('hidden');
        l2d.classList.add('hidden');

        if (!threeRenderer) initThreeEngine();
        loadMineLaz();
      }
    }
  </script>
</body>
</html>
